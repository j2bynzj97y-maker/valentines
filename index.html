<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rose Day ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    height:100vh;
    font-family:'Poppins', sans-serif;
    overflow:hidden;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
}

/* Screens */

.screen{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    transition:0.8s;
}

.hidden{
    opacity:0;
    pointer-events:none;
}

/* Text */

h1{
    color:white;
    font-size:2.2em;
    margin-bottom:20px;
    text-shadow:2px 2px 10px rgba(0,0,0,0.4);
}

.big{
    font-size:2.5em;
    font-weight:600;
}

/* Button */

button{
    padding:14px 30px;
    font-size:18px;
    border:none;
    border-radius:30px;
    background:#ff4d6d;
    color:white;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(0,0,0,0.3);
    transition:0.3s;
}

button:hover{
    transform:scale(1.1);
}

/* Roses */

.rose{
    position:absolute;
    font-size:30px;
    animation:fall linear infinite;
    pointer-events:none;
}

@keyframes fall{
    0%{
        transform:translateY(-50px) rotate(0deg);
        opacity:1;
    }
    100%{
        transform:translateY(110vh) rotate(360deg);
        opacity:0.9;
    }
}

/* Final Text */

#finalText{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:2.2em;
    font-weight:600;
    text-shadow:3px 3px 15px black;
    z-index:2;
    opacity:0;
    transition:1s;
}

.show{
    opacity:1;
}

</style>
</head>

<body>

<!-- SCREEN 1 -->

<div id="s1" class="screen">

    <h1>yk what day it isssss?????????</h1>

    <button onclick="start()">What???</button>

</div>


<!-- SCREEN 2 -->

<div id="s2" class="screen hidden">

    <div id="finalText">
        IT'S ROSE DAY FOR MY PRETTIEST SUNFLOWER ❤️🌹
    </div>

</div>


<script>

function start(){

    document.getElementById("s1").classList.add("hidden");
    document.getElementById("s2").classList.remove("hidden");

    setTimeout(()=>{
        document.getElementById("finalText").classList.add("show");
    },800);

    createRoses();
}


function createRoses(){

    for(let i=0;i<60;i++){

        let rose = document.createElement("div");
        rose.classList.add("rose");
        rose.innerHTML = "🌹";

        let size = Math.random()*25 + 20;

        rose.style.fontSize = size + "px";

        rose.style.left = Math.random()*100 + "vw";

        rose.style.animationDuration = (Math.random()*3 + 3) + "s";

        rose.style.animationDelay = Math.random()*2 + "s";

        document.body.appendChild(rose);
    }
}

</script>

</body>
</html>
