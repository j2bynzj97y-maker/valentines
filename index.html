<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Valentine ❤️</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'Poppins',sans-serif;
    height:100vh;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    transition:1s;
    overflow:hidden;
}

/* Screens */

.screen{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    background:rgba(0,0,0,0.45);
    padding:25px;
}

.active{
    display:flex;
}

/* Text */

h1{
    color:white;
    font-size:2.4em;
    margin-bottom:15px;
    letter-spacing:1px;
}

p{
    color:#eee;
    font-size:1.3em;
    max-width:600px;
    line-height:1.6;
}

/* Countdown */

#countdown{
    margin:15px 0;
    font-size:1.2em;
    color:#ffb3c6;
    font-weight:600;
}

/* Buttons */

.buttons{
    position:relative;
    width:340px;
    height:180px;
    margin-top:25px;
}

button{
    padding:14px 30px;
    font-size:17px;
    border:none;
    border-radius:40px;
    cursor:pointer;
    position:absolute;
    transition:0.6s cubic-bezier(.25,.8,.25,1);
}

/* Yes */

.yes{
    background:linear-gradient(135deg,#ff4d6d,#ff758f);
    color:white;
    left:50%;
    bottom:10px;
    transform:translateX(-50%);
    box-shadow:0 8px 25px rgba(255,77,109,0.5);
}

/* No */

.no{
    background:#333;
    color:white;
    top:10px;
    left:20px;
}

/* Gift */

.gift{
    width:130px;
    height:130px;
    background:linear-gradient(135deg,#ff4d6d,#ff758f);
    border-radius:18px;
    position:relative;
    cursor:pointer;
    transition:0.8s ease;
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

.gift::before{
    content:'';
    position:absolute;
    width:22px;
    height:100%;
    background:gold;
    left:50%;
    transform:translateX(-50%);
}

.gift::after{
    content:'';
    position:absolute;
    height:22px;
    width:100%;
    background:gold;
    top:50%;
    transform:translateY(-50%);
}

.open{
    transform:scale(1.4) rotate(15deg);
}

.fadeOut{
    animation:fade 0.8s forwards;
}

@keyframes fade{
    to{
        opacity:0;
        transform:scale(1.1);
    }
}

</style>
</head>

<body>

<!-- SCREEN 1 -->

<div id="s1" class="screen active">

    <h1>ROTUDUUU ❤️</h1>

    <p>Will you be my Valentine? 😙🤭❤️</p>

    <div id="countdown"></div>

    <div class="buttons">

        <button class="yes" onclick="yes()">Yes 😋❤️</button>

        <button class="no" id="noBtn">No 😞💔</button>

    </div>

</div>


<!-- SCREEN 2 -->

<div id="s2" class="screen">

<h1>
YAAAYYY 😙😙😙😙😙❤️❤️❤️  
I KNEW YOU'D SAY YESSSS 😙🤭❤️  
I LOVEEEE YOUUUUUU SOOOOO MUCHHHH 😙😙😙😙❤️❤️❤️❤️❤️❤️❤️❤️
</h1>

<p>Open the gift 🤭</p>

<div class="gift" onclick="openGift()"></div>

</div>


<!-- SCREEN 3 -->

<div id="s3" class="screen">

<h1>Forever Us ❤️😙🤭</h1>
<p>Happy Valentine My Love 😋❤️</p>

</div>


<script>

/* Backgrounds */

const bg1="49424D66-818C-4E33-B8EF-AA1B238B9EA5.jpeg";
const bg2="FA772161-E160-4EDE-B556-4F8ED0818F8A.jpeg";

document.body.style.backgroundImage=`url('${bg1}')`;


/* Smooth No Button */

const noBtn=document.getElementById("noBtn");
const area=document.querySelector(".buttons");

function moveSmooth(){

    const maxX=area.clientWidth-noBtn.clientWidth;
    const maxY=area.clientHeight-noBtn.clientHeight;

    const x=Math.random()*maxX;
    const y=Math.random()*maxY;

    noBtn.style.transform=`translate(${x}px,${y}px)`;
}

noBtn.addEventListener("mouseenter",moveSmooth);
noBtn.addEventListener("touchstart",moveSmooth);


/* YES */

function yes(){

    document.getElementById("s1").classList.add("fadeOut");

    setTimeout(()=>{

        document.getElementById("s1").classList.remove("active");
        document.getElementById("s2").classList.add("active");

    },700);
}


/* Gift */

function openGift(){

    const gift=document.querySelector(".gift");

    gift.classList.add("open");

    setTimeout(()=>{

        document.getElementById("s2").classList.remove("active");
        document.getElementById("s3").classList.add("active");

        document.body.style.backgroundImage=`url('${bg2}')`;

    },800);
}


/* Countdown */

const countdown=document.getElementById("countdown");

// Next Valentine
let year=new Date().getFullYear();
let valentine=new Date(`Feb 14, ${year} 00:00:00`);

if(new Date()>valentine){
    valentine=new Date(`Feb 14, ${year+1} 00:00:00`);
}

setInterval(()=>{

    const now=new Date();
    const diff=valentine-now;

    const d=Math.floor(diff/(1000*60*60*24));
    const h=Math.floor((diff/(1000*60*60))%24);
    const m=Math.floor((diff/(1000*60))%60);

    countdown.innerText=
    `⏳ ${d} Days ${h} Hours ${m} Minutes to Valentine`;

},1000);

</script>

</body>
</html>
