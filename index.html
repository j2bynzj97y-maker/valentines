<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Propose Day ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    height:100vh;
    overflow:hidden;
    font-family:'Poppins', sans-serif;
    background:#000;
}

/* Screens */

.screen{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    padding:25px;
    background-size:cover;
    background-position:center;
    transition:1s;
}

.hidden{
    opacity:0;
    pointer-events:none;
}

/* Backgrounds */

#s1{background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),
url("https://images.unsplash.com/photo-1509042239860-f550ce710b93");}

#s2{background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),
url("https://images.unsplash.com/photo-1526045478516-99145907023c");}

#s3{background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),
url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee");}

#s4{background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),
url("https://images.unsplash.com/photo-1517841905240-472988babdf9");}

/* Text */

h1{
    color:white;
    font-size:2.2em;
    margin-bottom:20px;
    text-shadow:0 0 25px #ff2f6d;
}

p{
    color:#ffe6ec;
    font-size:1.3em;
    line-height:1.6;
    max-width:500px;
}

/* Button */

button{
    padding:15px 40px;
    font-size:17px;
    border:none;
    border-radius:50px;
    background:#ff2f6d;
    color:white;
    cursor:pointer;
    margin-top:25px;
    box-shadow:0 0 20px #ff2f6d;
    transition:.3s;
}

button:hover{
    transform:scale(1.1);
}

/* Roses */

.rose{
    position:absolute;
    bottom:-30px;
    left:50%;
    font-size:28px;
    pointer-events:none;
    animation:burst linear forwards;
}

@keyframes burst{

    from{
        transform:translateX(-50%) scale(.7);
        opacity:1;
    }

    to{
        transform:
        translate(
            calc(-50% + var(--x)),
            -110vh
        )
        rotate(var(--r))
        scale(1.4);

        opacity:.9;
    }
}

</style>
</head>

<body>

<!-- Screen 1 -->

<div id="s1" class="screen">

    <h1>Hey Rotuduuuuu… ❤️</h1>

    <button onclick="go(2)">Continue</button>

</div>


<!-- Screen 2 -->

<div id="s2" class="screen hidden">

    <p>
        I'VE BEEN WAITINGGG TO ASK THIS AGAINNN THIS YEAR.<br>
        AND MANY MORE TO COMEE.<br><br>
        AGHHHH CANT WAIT TO ASKKK YOUUUU 😙
    </p>

    <button onclick="go(3)">Next</button>

</div>


<!-- Screen 3 -->

<div id="s3" class="screen hidden">

    <h1>It’s Propose Day 🌹</h1>

    <p>
        SHOULLDDD I ASKKK YOUUUU<br>
        HMMMMMMMM.....
    </p>

    <button onclick="startRoses()">See ❤️</button>

</div>


<!-- Screen 4 -->

<div id="s4" class="screen hidden">

    <h1 id="final">
        OFCCCC IM GONNAAA ASK YOUUUU HHEHEHEH
    </h1>

    <p>
        WILLL YOOU BE MINEEEE FOREVERRR, ALWAYSSS?
    </p>

    <button onclick="final()">Always ❤️</button>

</div>


<script>

let current=1;

/* Screen Change */

function go(n){

    document.getElementById("s"+current).classList.add("hidden");
    document.getElementById("s"+n).classList.remove("hidden");

    current=n;
}


/* Rose Explosion */

function startRoses(){

    go(4);

    let burst=setInterval(()=>{

        for(let i=0;i<18;i++){
            createRose();
        }

    },150);

    setTimeout(()=>{
        clearInterval(burst);
    },1800);
}


function createRose(){

    let r=document.createElement("div");
    r.className="rose";
    r.innerHTML="🌹";

    let size=Math.random()*16+22;
    r.style.fontSize=size+"px";

    let x=(Math.random()-0.5)*500;
    r.style.setProperty("--x",x+"px");

    let rot=Math.random()*720+"deg";
    r.style.setProperty("--r",rot);

    let t=Math.random()+2;
    r.style.animationDuration=t+"s";

    document.body.appendChild(r);

    setTimeout(()=>r.remove(),3000);
}


/* Final */

function final(){
    alert("Happy Propose Day, my love 😙❤️\nForever yours.");
}

</script>

</body>
</html>
