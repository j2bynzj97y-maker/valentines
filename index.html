<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Propose Day ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    height:100vh;
    font-family:'Poppins', sans-serif;
    background:linear-gradient(to top right,#ffd1dc,#fff0f5);
    overflow:hidden;
}

/* Screens */

.screen{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    padding:25px;
}

.hidden{
    display:none;
}

/* Text */

h1{
    color:#ff3366;
    font-size:2.2em;
    margin-bottom:20px;
}

p{
    color:#444;
    font-size:1.3em;
    line-height:1.6;
    max-width:500px;
}

/* Button */

button{
    padding:14px 35px;
    font-size:17px;
    border:none;
    border-radius:40px;
    background:#ff3366;
    color:white;
    cursor:pointer;
    margin-top:25px;
    box-shadow:0 6px 18px rgba(0,0,0,0.25);
    transition:0.3s;
}

button:hover{
    transform:scale(1.1);
}

/* Typing */

.typing{
    border-right:2px solid #ff3366;
    white-space:nowrap;
    overflow:hidden;
    animation:blink 0.7s infinite;
}

@keyframes blink{
    50%{border-color:transparent;}
}

/* Hearts */

.heart{
    position:absolute;
    font-size:18px;
    color:#ff4d6d;
    animation:float 5s linear infinite;
    opacity:0.7;
}

@keyframes float{
    from{
        transform:translateY(100vh) scale(0.8);
    }
    to{
        transform:translateY(-100vh) scale(1.3);
    }
}

</style>
</head>

<body>

<!-- Screen 1 -->

<div id="s1" class="screen">

    <h1 id="type1"></h1>

    <button id="btn1" style="display:none" onclick="next1()">
        Tell me ❤️
    </button>

</div>


<!-- Screen 2 -->

<div id="s2" class="screen hidden">

    <p id="type2"></p>

    <button id="btn2" style="display:none" onclick="next2()">
        And...? 🤭
    </button>

</div>


<!-- Screen 3 -->

<div id="s3" class="screen hidden">

    <h1 id="type3"></h1>

    <button onclick="finalYes()">
        YES ❤️
    </button>

</div>


<script>

/* Floating Hearts */

for(let i=0;i<20;i++){
    let h=document.createElement("div");
    h.className="heart";
    h.innerHTML="❤️";
    h.style.left=Math.random()*100+"vw";
    h.style.animationDuration=(Math.random()*3+4)+"s";
    document.body.appendChild(h);
}


/* Typing Effect */

function typeText(id,text,callback){

    let i=0;
    let el=document.getElementById(id);

    el.classList.add("typing");
    el.innerHTML="";

    let interval=setInterval(()=>{

        el.innerHTML+=text[i];
        i++;

        if(i>=text.length){
            clearInterval(interval);
            el.classList.remove("typing");
            if(callback)callback();
        }

    },60);
}


/* Start */

typeText("type1",
"There’s something I’ve been wanting to ask you… 😙",
()=>{
    document.getElementById("btn1").style.display="block";
});


function next1(){

    document.getElementById("s1").classList.add("hidden");
    document.getElementById("s2").classList.remove("hidden");

    typeText("type2",
"From laughing with you…\nTo missing you every day…\nTo smiling at my phone because of you…\n\nRotuduuuuu, you make my world better ❤️",
()=>{
        document.getElementById("btn2").style.display="block";
    });
}


function next2(){

    document.getElementById("s2").classList.add("hidden");
    document.getElementById("s3").classList.remove("hidden");

    typeText("type3",
"Will you be mine…\nNot just today…\nBut always? ❤️");
}


function finalYes(){

    alert("I’m yours forever 😙❤️\nHappy Propose Day, my love 💖");
}

</script>

</body>
</html>
