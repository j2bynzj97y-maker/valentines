<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Valentine ❤️</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;

            /* Background images */
            background-image: 
                url("49424D66-818C-4E33-B8EF-AA1B238B9EA5.jpeg"),
                url("FA772161-E160-4EDE-B556-4F8ED0818F8A.jpeg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            animation: changeBG 10s infinite alternate;
        }

        /* Background change animation */
        @keyframes changeBG {
            0% {
                background-image: url("49424D66-818C-4E33-B8EF-AA1B238B9EA5.jpeg");
            }
            100% {
                background-image: url("FA772161-E160-4EDE-B556-4F8ED0818F8A.jpeg");
            }
        }

        /* Dark overlay for readability */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
        }

        /* Center box */
        .container {
            position: relative;
            z-index: 2;

            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;

            text-align: center;
            color: white;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.3rem;
            max-width: 600px;
        }

        button {
            margin-top: 25px;
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 25px;
            cursor: pointer;

            background: #ff4d6d;
            color: white;

            transition: 0.3s;
        }

        button:hover {
            background: #ff1f4b;
            transform: scale(1.05);
        }

        /* Mobile fix */
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }

            p {
                font-size: 1.1rem;
            }
        }
    </style>
</head>

<body>

    <!-- Dark overlay -->
    <div class="overlay"></div>

    <!-- Main Content -->
    <div class="container">

        <h1>Will You Be My Valentine? 😙❤️</h1>

        <p>
            YAAAYYY 😙😙😙😙😙❤️❤️❤️  
            I KNEW YOU'D SAY YESSSS 😙🤭❤️  
            I LOVEEEE YOUUUUUU SOOOOO MUCHHHH 😙😙😙😙❤️❤️❤️❤️❤️❤️❤️❤️
        </p>

        <button onclick="showLove()">Click Me 😋</button>

    </div>

    <script>
        function showLove() {
            alert("I Love You So Much 😙❤️🤭");
        }
    </script>

</body>
</html>
