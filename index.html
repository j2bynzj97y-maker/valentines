<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bully Mode 🤭❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;}

body{
    margin:0;
    height:100vh;
    overflow:hidden;
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#ffd6e8,#fff0f5);
}

/* screens */

.screen{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:25px;
    transition:.8s;
}

.hidden{
    opacity:0;
    pointer-events:none;
}

/* text */

h1{
    font-size:2.1em;
    color:#ff4d88;
    margin-bottom:15px;
}

p{
    font-size:1.1em;
    color:#444;
    max-width:500px;
    line-height:1.6;
}

/* buttons */

button{
    margin-top:20px;
    padding:14px 36px;
    border:none;
    border-radius:40px;
    font-size:16px;
    cursor:pointer;
    background:#ff6fa5;
    color:white;
    box-shadow:0 8px 20px rgba(255,111,165,.4);
    transition:.25s;
}

button:hover{
    transform:scale(1.08);
}

/* bully buttons */

.choice{
    background:white;
    color:#ff4d88;
    margin:10px;
}

/* shake */

.shake{
    animation:shake .3s linear 3;
}

@keyframes shake{
    0%{transform:translateX(0)}
    25%{transform:translateX(-6px)}
    50%{transform:translateX(6px)}
    75%{transform:translateX(-6px)}
    100%{transform:translateX(0)}
}

/* roses */

.rose{
    position:absolute;
    bottom:-20px;
    left:50%;
    font-size:28px;
    animation:burst linear forwards;
    pointer-events:none;
}

@keyframes burst{
    from{
        transform:translateX(-50%) scale(.8);
        opacity:1;
    }
    to{
        transform:
        translate(calc(-50% + var(--x)),-110vh)
        rotate(var(--r))
        scale(1.3);
        opacity:.9;
    }
}

</style>
</head>

<body>

<!-- Screen 1 -->

<div id="s1" class="screen">
<h1>HIEEEEEE 😞❤️</h1>
<p>AAPTO APNE BABY SE NAARAZ HE HOGYE😞😞</p>
<button onclick="go(2)">Yes 😒</button>
</div>

<!-- Screen 2 -->

<div id="s2" class="screen hidden">
<h1>BULLY MODE: ON 😤</h1>
<p>WELL SINCE YOU MAD AT ME<br>YOU GET FULL CONTROL.</p>

<button class="choice" onclick="insult()">Insult Him 😤</button>
<button class="choice" onclick="suffer()">Make Him Suffer 😏</button>
<button class="choice" onclick="forgive()">Forgive Him (maybe) 🤭</button>

<p id="response"></p>
</div>

<!-- Screen 3 -->

<div id="s3" class="screen hidden">
<h1>Okay okay 😞❤️</h1>
<p>
IT WONT HAPPN AGAIN.<br>
WILL INFORM DHNG SE.<br>
I'LL GET YOU CHOCOLATES ASWELL.<br><br>
AND ALSOO<br>
I LOVE YOU SO SO MUCH 🤭❤️
</p>
</div>

<script>

let current=1;

function go(n){
    document.getElementById("s"+current).classList.add("hidden");
    document.getElementById("s"+n).classList.remove("hidden");
    current=n;
}

/* insults */

const insults=[
"HATE HIM.",
"FCK YOU.",
"THINKS HE'S CUTE (he is 😞❤️).",
"ANNOYING.",
"NEEDS PITAAI😞."
];

function insult(){
    document.getElementById("response").innerText=
    insults[Math.floor(Math.random()*insults.length)];
}

/* suffer */

function suffer(){
    document.body.classList.add("shake");
    document.getElementById("response").innerText=
    "ALREADY SUFFERING MY LOVE, ALREADY SUFFERING 😞❤️";
    setTimeout(()=>document.body.classList.remove("shake"),800);
}

/* forgive */

function forgive(){
    go(3);
    startRoses();
}

/* roses */

function startRoses(){
    let burst=setInterval(()=>{
        for(let i=0;i<18;i++){
            createRose();
        }
    },130);

    setTimeout(()=>clearInterval(burst),1600);
}

function createRose(){
    let r=document.createElement("div");
    r.className="rose";
    r.innerHTML="🌹";
    r.style.setProperty("--x",(Math.random()-0.5)*500+"px");
    r.style.setProperty("--r",Math.random()*720+"deg");
    r.style.fontSize=(22+Math.random()*18)+"px";
    r.style.animationDuration=(2+Math.random())+"s";
    document.body.appendChild(r);
    setTimeout(()=>r.remove(),3000);
}

</script>

</body>
</html>
