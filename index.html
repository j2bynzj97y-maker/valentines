<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rose Day ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>

*{box-sizing:border-box;}

body{
    margin:0;
    font-family:'Poppins',sans-serif;
    height:100vh;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    transition:1s;
    overflow:hidden;
}

/* Screen */

.screen{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    background:rgba(0,0,0,0.45);
    padding:25px;
}

/* Text */

h1{
    color:white;
    font-size:2.4em;
    margin-bottom:15px;
}

p{
    color:#eee;
    font-size:1.3em;
    max-width:650px;
    line-height:1.6;
}

/* Countdown */

#countdown{
    margin:18px 0;
    font-size:1.2em;
    color:#ffb3c6;
    font-weight:600;
}

/* Button */

button{
    padding:14px 32px;
    font-size:17px;
    border:none;
    border-radius:40px;
    cursor:pointer;
    background:linear-gradient(135deg,#ff4d6d,#ff758f);
    color:white;
    box-shadow:0 8px 25px rgba(255,77,109,0.5);
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

/* Rose */

.rose{
    font-size:90px;
    margin:20px 0;
    animation:float 3s ease-in-out infinite;
}

@keyframes float{
    0%{transform:translateY(0);}
    50%{transform:translateY(-15px);}
    100%{transform:translateY(0);}
}

/* Fade */

.fadeOut{
    animation:fade 1s forwards;
}

@keyframes fade{
    to{
        opacity:0;
        transform:scale(1.1);
    }
}

.hidden{
    display:none;
}

</style>
</head>

<body>

<!-- SCREEN 1 -->

<div id="s1" class="screen">

    <h1>Happy Rose Day ❤️🌹</h1>

    <p>
    To my favorite person in the world 😙🤭❤️  
    This little page is just for you.
    </p>

    <div class="rose">🌹</div>

    <button onclick="openRose()">For You 😋❤️</button>

</div>


<!-- SCREEN 2 -->

<div id="s2" class="screen hidden">

    <h1>My Rose, My Love ❤️</h1>

    <p>
    Just like this rose,  
    you make my life more beautiful every day 😙❤️  
    Thank you for choosing me.  
    I’m always yours 🤭💘
    </p>

    <div id="countdown"></div>

</div>


<script>

/* Backgrounds */

const bg1="49424D66-818C-4E33-B8EF-AA1B238B9EA5.jpeg";
const bg2="FA772161-E160-4EDE-B556-4F8ED0818F8A.jpeg";

document.body.style.backgroundImage=`url('${bg1}')`;


/* Open Rose */

function openRose(){

    document.getElementById("s1").classList.add("fadeOut");

    setTimeout(()=>{

        document.getElementById("s1").classList.add("hidden");
        document.getElementById("s2").classList.remove("hidden");

        document.body.style.backgroundImage=`url('${bg2}')`;

    },900);
}


/* Valentine Countdown */

const countdown=document.getElementById("countdown");

let year=new Date().getFullYear();
let valentine=new Date(`Feb 14, ${year} 00:00:00`);

if(new Date()>valentine){
    valentine=new Date(`Feb 14, ${year+1} 00:00:00`);
}

setInterval(()=>{

    const now=new Date();
    const diff=valentine-now;

    const d=Math.floor(diff/(1000*60*60*24));
    const h=Math.floor((diff/(1000*60*60))%24);
    const m=Math.floor((diff/(1000*60))%60);

    countdown.innerText=
    `⏳ ${d} Days ${h} Hours ${m} Minutes until Valentine`;

},1000);

</script>

</body>
</html>
