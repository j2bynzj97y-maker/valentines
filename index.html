<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Valentine</title>

<style>

body{
    margin:0;
    font-family: 'Comic Sans MS', cursive;
    text-align:center;
    height:100vh;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    transition:background 1s ease;
}

/* Screens */

.screen{
    display:none;
    height:100vh;
    width:100%;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    backdrop-filter: blur(3px);
    background:rgba(0,0,0,0.4);
    padding:20px;
}

.active{
    display:flex;
}

/* Text */

h1{
    color:white;
    font-size:2.2em;
    margin-bottom:20px;
    text-shadow:2px 2px 5px black;
}

p{
    color:white;
    font-size:1.4em;
    text-shadow:2px 2px 5px black;
}

/* Buttons */

.buttons{
    position:relative;
    width:300px;
    height:120px;
}

button{
    padding:12px 25px;
    font-size:18px;
    border:none;
    border-radius:25px;
    margin:10px;
    cursor:pointer;
    position:absolute;
}

.yes{
    background:#ff4d6d;
    color:white;
    left:20px;
    bottom:10px;
}

.no{
    background:#444;
    color:white;
    right:20px;
    bottom:10px;
    transition:0.2s;
}

/* Gift */

.gift{
    width:120px;
    height:120px;
    background:red;
    border-radius:15px;
    position:relative;
    cursor:pointer;
    transition:0.6s ease;
}

.gift::before{
    content:'';
    position:absolute;
    width:20px;
    height:100%;
    background:gold;
    left:50%;
    transform:translateX(-50%);
}

.gift::after{
    content:'';
    position:absolute;
    height:20px;
    width:100%;
    background:gold;
    top:50%;
    transform:translateY(-50%);
}

.open{
    transform:scale(1.2) rotate(10deg);
}

</style>
</head>

<body>

<!-- SCREEN 1 -->

<div id="s1" class="screen active">
    <h1>ROTUDUUU ❤️</h1>
    <p>Will you be my Valentine? 😙🤭❤️</p>

    <div class="buttons">
        <button class="yes" onclick="yes()">Yes 😋❤️</button>
        <button class="no" id="noBtn">No 😞💔</button>
    </div>
</div>


<!-- SCREEN 2 -->

<div id="s2" class="screen">
    <h1>
    YAAAYYY 😙😙😙😙😙❤️❤️❤️  
    I KNEW YOU'D SAY YESSSS 😙🤭❤️  
    I LOVEEEE YOUUUUUU SOOOOO MUCHHHH 😙😙😙😙❤️❤️❤️❤️❤️❤️❤️❤️
    </h1>

    <p>Tap the gift 🤭</p>

    <div class="gift" onclick="openGift()"></div>
</div>


<!-- SCREEN 3 -->

<div id="s3" class="screen">
    <h1>Forever You & Me ❤️😙🤭</h1>
    <p>Happy Valentine My Love 😋❤️</p>
</div>


<script>

/* Backgrounds */
const bg1 = "49424D66-818C-4E33-B8EF-AA1B238B9EA5.jpeg";
const bg2 = "FA772161-E160-4EDE-B556-4F8ED0818F8A.jpeg";

document.body.style.backgroundImage = `url('${bg1}')`;

/* Yes Button */
function yes(){
    document.getElementById("s1").classList.remove("active");
    document.getElementById("s2").classList.add("active");

    document.body.style.backgroundImage = `url('${bg1}')`;
}

/* Moving No Button 😏 */
const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("mouseover", moveButton);
noBtn.addEventListener("click", moveButton);

function moveButton(){

    const container = document.querySelector(".buttons");

    const maxX = container.clientWidth - noBtn.clientWidth;
    const maxY = container.clientHeight - noBtn.clientHeight;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

/* Gift */

function openGift(){

    const gift = document.querySelector(".gift");

    gift.classList.add("open");

    setTimeout(()=>{

        document.getElementById("s2").classList.remove("active");
        document.getElementById("s3").classList.add("active");

        document.body.style.backgroundImage = `url('${bg2}')`;

    },600);
}

</script>

</body>
</html>
