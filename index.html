<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rose Day ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    height:100vh;
    font-family:'Poppins', sans-serif;
    overflow:hidden;
    background:linear-gradient(to top,#b31217,#e52d27);
}

/* Screens */

.screen{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
}

.hidden{
    display:none;
}

/* Text */

h1{
    color:white;
    font-size:2.4em;
    margin-bottom:25px;
    text-shadow:3px 3px 20px rgba(0,0,0,0.7);
}

/* Button */

button{
    padding:15px 40px;
    font-size:18px;
    border:none;
    border-radius:50px;
    background:#ff1744;
    color:white;
    cursor:pointer;
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
    transition:0.3s;
}

button:hover{
    transform:scale(1.15);
}

/* Overlay for readability */

#overlay{
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.35);
    z-index:2;
    opacity:0;
    transition:1s;
}

.showOverlay{
    opacity:1;
}

/* Final Text */

#finalText{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:2.5em;
    font-weight:800;
    text-align:center;
    text-shadow:4px 4px 30px black;
    z-index:5; /* ALWAYS ABOVE ROSES */
    opacity:0;
    transition:1.5s;
    padding:15px;
}

.showText{
    opacity:1;
}

/* Volcano Base */

#volcano{
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:80px;
    height:40px;
    background:rgba(0,0,0,0.3);
    border-radius:50%;
    z-index:1;
}

/* Roses */

.rose{
    position:absolute;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    font-size:28px;
    pointer-events:none;
    z-index:3;
    animation:erupt linear forwards;
}

@keyframes erupt{

    0%{
        transform:translate(-50%,0) scale(0.8);
        opacity:1;
    }

    30%{
        opacity:1;
    }

    100%{
        transform:
        translate(calc(-50% + var(--x)), -120vh)
        rotate(var(--r))
        scale(1.5);

        opacity:0.9;
    }
}

</style>
</head>

<body>

<!-- SCREEN 1 -->

<div id="s1" class="screen">

    <h1>yk what day it isssss?????????</h1>

    <button onclick="start()">What???</button>

</div>


<!-- SCREEN 2 -->

<div id="s2" class="screen hidden">

    <div id="overlay"></div>

    <div id="finalText">
        IT'S ROSE DAY FOR MY PRETTIEST SUNFLOWER ❤️🌹
    </div>

    <div id="volcano"></div>

</div>


<script>

let eruptionInterval;

function start(){

    document.getElementById("s1").classList.add("hidden");
    document.getElementById("s2").classList.remove("hidden");

    document.getElementById("overlay").classList.add("showOverlay");

    setTimeout(()=>{
        document.getElementById("finalText").classList.add("showText");
    },1000);

    startEruption();
}


/* Volcano Eruption */

function startEruption(){

    eruptionInterval = setInterval(()=>{

        for(let i=0;i<20;i++){

            createRose();

        }

    },220); // FAST 🔥🔥🔥
}


function createRose(){

    let rose = document.createElement("div");
    rose.className = "rose";
    rose.innerHTML = "🌹";

    // Random size
    let size = Math.random()*18 + 22;
    rose.style.fontSize = size + "px";

    // Spread angle (left/right)
    let spread = (Math.random()-0.5) * 400; // px
    rose.style.setProperty("--x", spread+"px");

    // Rotation
    let rot = Math.random()*720+"deg";
    rose.style.setProperty("--r", rot);

    // Speed
    let duration = Math.random()*1.2 + 2;
    rose.style.animationDuration = duration+"s";

    document.body.appendChild(rose);

    setTimeout(()=>{
        rose.remove();
    },3500);
}

</script>

</body>
</html>
