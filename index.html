<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rose Day ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    height:100vh;
    font-family:'Poppins', sans-serif;
    overflow:hidden;
    background:radial-gradient(circle at top,#ff758c,#ff7eb3);
}

/* Screens */

.screen{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
}

.hidden{
    display:none;
}

/* Text */

h1{
    color:white;
    font-size:2.3em;
    margin-bottom:25px;
    text-shadow:2px 2px 15px rgba(0,0,0,0.5);
}

/* Button */

button{
    padding:15px 35px;
    font-size:18px;
    border:none;
    border-radius:40px;
    background:#ff2f5e;
    color:white;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(0,0,0,0.4);
    transition:0.3s;
}

button:hover{
    transform:scale(1.15);
}

/* Final Text */

#finalText{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:2.4em;
    font-weight:700;
    text-align:center;
    text-shadow:4px 4px 25px black;
    z-index:5;
    opacity:0;
    transition:1.5s;
    pointer-events:none;
}

.showText{
    opacity:1;
}

/* Roses */

.rose{
    position:absolute;
    bottom:-50px;
    font-size:28px;
    animation:erupt linear forwards;
    pointer-events:none;
    z-index:3;
}

@keyframes erupt{
    0%{
        transform:translateY(0) scale(0.8) rotate(0deg);
        opacity:1;
    }

    50%{
        opacity:1;
    }

    100%{
        transform:translateY(-120vh) scale(1.4) rotate(720deg);
        opacity:0.9;
    }
}

</style>
</head>

<body>

<!-- SCREEN 1 -->

<div id="s1" class="screen">

    <h1>yk what day it isssss?????????</h1>

    <button onclick="start()">What???</button>

</div>


<!-- SCREEN 2 -->

<div id="s2" class="screen hidden">

    <div id="finalText">
        IT'S ROSE DAY FOR MY PRETTIEST SUNFLOWER ❤️🌹
    </div>

</div>


<script>

let eruptionInterval;

function start(){

    document.getElementById("s1").classList.add("hidden");
    document.getElementById("s2").classList.remove("hidden");

    setTimeout(()=>{
        document.getElementById("finalText").classList.add("showText");
    },1200);

    startEruption();
}


/* Volcano Roses */

function startEruption(){

    eruptionInterval = setInterval(()=>{

        for(let i=0;i<15;i++){

            createRose();

        }

    },250); // FAST cycles 🔥
}


function createRose(){

    let rose = document.createElement("div");
    rose.className = "rose";
    rose.innerHTML = "🌹";

    let size = Math.random()*20 + 22;
    rose.style.fontSize = size + "px";

    let x = Math.random()*100;
    rose.style.left = x + "vw";

    let duration = Math.random()*1.5 + 2;
    rose.style.animationDuration = duration + "s";

    document.body.appendChild(rose);

    setTimeout(()=>{
        rose.remove();
    },4000);
}

</script>

</body>
</html>
