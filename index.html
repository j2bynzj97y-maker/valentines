<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rose Day ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    height:100vh;
    overflow:hidden;
    font-family:'Poppins', sans-serif;
    background:linear-gradient(to top,#fff1f5,#ffe4ec);
}

/* Screens */

.screen{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
}

.hidden{
    display:none;
}

/* Text */

h1{
    color:#ff2f6d;
    font-size:2.4em;
    margin-bottom:25px;
    text-shadow:1px 1px 5px rgba(0,0,0,0.2);
}

#finalText{
    position:absolute;
    top:35%;
    width:100%;
    padding:20px;
    font-size:2.3em;
    font-weight:800;
    color:#ff1744;
    text-align:center;
    z-index:9999; /* ALWAYS ON TOP */
    opacity:0;
    transition:1s;
}

.showText{
    opacity:1;
}

/* Button */

button{
    padding:15px 40px;
    font-size:18px;
    border:none;
    border-radius:50px;
    background:#ff1744;
    color:white;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
    transition:0.3s;
}

button:hover{
    transform:scale(1.1);
}

/* Roses */

.rose{
    position:absolute;
    bottom:0;
    left:50%;
    font-size:26px;
    pointer-events:none;
    animation:shoot linear forwards;
}

/* Volcano Eruption */

@keyframes shoot{

    from{
        transform:translate(-50%,0) scale(0.8);
        opacity:1;
    }

    to{
        transform:
        translate(
            calc(-50% + var(--x)),
            calc(-100vh + var(--y))
        )
        rotate(var(--r))
        scale(1.4);

        opacity:0.9;
    }
}

</style>
</head>

<body>

<!-- Screen 1 -->

<div id="s1" class="screen">

    <h1>yk what day it isssss?????????</h1>

    <button onclick="start()">What???</button>

</div>


<!-- Screen 2 -->

<div id="s2" class="screen hidden">

    <div id="finalText">
        IT'S ROSE DAY FOR MY PRETTIEST SUNFLOWER ❤️🌹
    </div>

</div>


<script>

let burstInterval;

function start(){

    document.getElementById("s1").classList.add("hidden");
    document.getElementById("s2").classList.remove("hidden");

    // Show text clearly
    setTimeout(()=>{
        document.getElementById("finalText").classList.add("showText");
    },500);

    startVolcano();
}


/* Volcano Effect */

function startVolcano(){

    burstInterval = setInterval(()=>{

        for(let i=0;i<25;i++){
            createRose();
        }

    },180); // FAST BURSTS 🔥
}


function createRose(){

    let rose = document.createElement("div");
    rose.className = "rose";
    rose.innerHTML = "🌹";

    // Random size
    let size = Math.random()*15 + 22;
    rose.style.fontSize = size+"px";

    // X spread (left-right)
    let x = (Math.random()-0.5) * 600;
    rose.style.setProperty("--x", x+"px");

    // Y spread (upwards blast)
    let y = Math.random()*200;
    rose.style.setProperty("--y", y+"px");

    // Rotation
    let r = Math.random()*720+"deg";
    rose.style.setProperty("--r", r);

    // Speed
    let time = Math.random()*1 + 2;
    rose.style.animationDuration = time+"s";

    document.body.appendChild(rose);

    setTimeout(()=>{
        rose.remove();
    },3000);
}

</script>

</body>
</html>
